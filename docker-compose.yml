services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      DB_FILE: /data/data.db
      MODELS_DIR: /data/models-json
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - backend-data:/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  backend-data:
